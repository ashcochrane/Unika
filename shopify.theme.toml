# Shopify CLI theme environments.
#   npm run push:dev   -> pushes to the unpublished dev theme, never live
#   npm run pull       -> pulls the live theme (do this before starting work)

[environments.development]
store = "unika-nz.myshopify.com"
# Set to a dedicated unpublished dev theme before using push:dev.
# An unpublished theme already exists: "Copy of Unika/main" (130931064929).
# Confirm it is not a backup someone relies on before targeting it, or create a
# fresh one:  shopify theme push --unpublished --theme "Dev - trade portal"
# theme = "130931064929"

[environments.live]
store = "unika-nz.myshopify.com"
live = true
